<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:700;src:url(../fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:'Inter';font-weight:800;src:url(../fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:'Inter';font-weight:900;src:url(../fonts/inter-latin-900-normal.woff2)}
@font-face{font-family:'Anton';src:url(../fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:'Caveat';font-weight:700;src:url(../fonts/caveat-latin-700-normal.woff2)}
@font-face{font-family:'GreatVibes';src:url(../fonts/great-vibes-latin-400-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="cv" width="1080" height="1920"></canvas>
<script>
// Editorial-poster motion graphics engine. render(t) draws frame at time t (s). Deterministic.
const W = 1080, H = 1920;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const TL = window.TL || [];
const COL = {
  cream: '#efe8da', red: '#d4251c', ink: '#141210', sky1: '#5d91d5', sky2: '#a9c8ee',
  hill1: '#69a92f', hill2: '#3f7d1d', track: '#2c5fae', pink: '#e8a3dc', dark: '#1c1417',
  pale: '#f6f0b4', white: '#fbfaf5', yellow: '#f2c230', green: '#5f7f1d'
};

// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutBack = k => { const c = 2.2; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const frac = x => x - Math.floor(x);
function fitSize(text, family, maxW, maxS) {
  ctx.font = `100px ${family}`; ctx.letterSpacing = '0px';
  return Math.min(maxS, 100 * maxW / ctx.measureText(text).width);
}

// ---------- timeline ----------
let acc = 0;
TL.forEach((b, i) => { b.start = acc; acc += b.d; b.i = i; });
const TOTAL = acc; window.TOTAL = TOTAL;
function beatAt(t) { for (const b of TL) if (t < b.start + b.d) return b; return TL[TL.length - 1]; }

// ---------- textures ----------
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const grains = [];
(function () {
  const r = rng(7);
  for (let g = 0; g < 6; g++) {
    const c = mk(540, 960), x = c.getContext('2d'), im = x.createImageData(540, 960);
    for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    x.putImageData(im, 0, 0); grains.push(c);
  }
})();
const GRASS = (() => {
  const c = mk(1300, 2200), x = c.getContext('2d'), r = rng(42);
  x.fillStyle = '#7f9c25'; x.fillRect(0, 0, 1300, 2200);
  const tmp = mk(1300, 2200), y = tmp.getContext('2d');
  const cols = ['#2f4a0c', '#3e5c12', '#9bbb2f', '#b9d24a', '#57751a', '#c8dc5c'];
  for (let i = 0; i < 260; i++) {
    y.fillStyle = cols[Math.floor(r() * cols.length)];
    y.beginPath(); y.ellipse(r() * 1300, r() * 2200, 60 + r() * 170, 30 + r() * 70, r() * .4 - .2, 0, 6.283); y.fill();
  }
  x.filter = 'blur(38px)'; x.drawImage(tmp, 0, 0); x.filter = 'none';
  const im = x.getImageData(0, 0, 1300, 2200);
  for (let i = 0; i < im.data.length; i += 4) { const n = (r() - .5) * 70; im.data[i] += n; im.data[i + 1] += n * 1.1; im.data[i + 2] += n * .5; }
  x.putImageData(im, 0, 0);
  return c;
})();
const BLOSSOM_DOTS = (() => { const r = rng(5); return Array.from({ length: 220 }, () => ({ a: r() * 6.283, d: r(), s: 4 + r() * 12 })); })();

// ---------- backgrounds ----------
function paperBg(col) { ctx.fillStyle = col; ctx.fillRect(-60, -60, W + 120, H + 120); }
function grassBg(lt) {
  const s = 1.06 + lt * .012;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-650 + Math.sin(lt * .5) * 20, -1100 + lt * 8);
  ctx.drawImage(GRASS, 0, 0); ctx.restore();
}
function skyBg(lt) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, COL.sky1); g.addColorStop(.75, COL.sky2);
  ctx.fillStyle = g; ctx.fillRect(-60, -60, W + 120, H + 120);
  const cx = 820 + lt * 40, cy = 1060 - lt * 22;
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - 90, cy + 50); ctx.lineTo(cx, cy); ctx.stroke(); ctx.restore();
  ctx.fillStyle = 'rgba(255,247,214,.9)'; ctx.beginPath(); ctx.arc(250, 1530 - Math.min(lt, 3) * 30, 120, 0, 6.283); ctx.fill();
  ctx.save(); ctx.beginPath();
  ctx.moveTo(-60, 1640); ctx.bezierCurveTo(250, 1520, 760, 1500, W + 60, 1610); ctx.lineTo(W + 60, H + 60); ctx.lineTo(-60, H + 60); ctx.closePath(); ctx.clip();
  const hg = ctx.createLinearGradient(0, 1500, 0, H); hg.addColorStop(0, COL.hill1); hg.addColorStop(1, COL.hill2);
  ctx.fillStyle = hg; ctx.fillRect(-60, 1400, W + 120, 600);
  ctx.globalAlpha = .35; ctx.globalCompositeOperation = 'overlay'; ctx.drawImage(GRASS, 0, 1200, 1300, 900); ctx.restore();
}
function trackBg(lt) {
  ctx.fillStyle = COL.track; ctx.fillRect(-60, -60, W + 120, H + 120);
  const lane = (i, y) => { const k = y / H; return W * .58 + i * (70 + k * 150) - Math.pow(1 - k, 2) * 520 + Math.sin(k * 3) * 30; };
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.88)'; ctx.lineCap = 'round'; ctx.lineWidth = 5;
  for (let i = -7; i <= 7; i++) {
    ctx.beginPath();
    for (let y = -40; y <= H + 40; y += 20) { const x = lane(i, y); y === -40 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
  for (let m = 0; m < 6; m++) {
    const y = frac(m / 6 + lt * .14) * (H + 200) - 100;
    for (let i = -7; i < 7; i++) {
      const x0 = lane(i, y), x1 = lane(i + 1, y);
      for (let k = 0; k < 4; k++) { const a = lerp(x0, x1, .15 + k * .2); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(a, y, (x1 - x0) * .08, 4 + 6 * y / H); }
    }
  }
  ctx.restore();
  const ry = H * (0.9 - frac(lt * .18) * .5), rx = (lane(0, ry) + lane(1, ry)) / 2;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(rx + 10, ry + 28, 30, 9, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = COL.cream; ctx.beginPath(); ctx.arc(rx, ry, 22 + 10 * ry / H, 0, 6.283); ctx.fill();
}
function pinkBg(lt, small) {
  paperBg(COL.pink);
  const x0 = 50, y0 = 150, x1 = W - 50, y1 = H - 150;
  ctx.fillStyle = COL.dark; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
  ctx.strokeStyle = 'rgba(232,163,220,.75)'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.moveTo(x1, y0); ctx.lineTo(x0, y1); ctx.moveTo(W / 2, y0); ctx.lineTo(W / 2, y1); ctx.moveTo(x0, H / 2); ctx.lineTo(x1, H / 2); ctx.stroke();
  const rot = lt * .15;
  [[300, 560], [780, 560], [300, 1360], [780, 1360]].forEach(([cx, cy], i) => {
    const d = i % 2 ? 1 : -1;
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(cx, cy, 70 + k * 55, rot * d + k, rot * d + k + 4.4); ctx.stroke(); }
  });
  ctx.restore();
  ctx.strokeStyle = COL.pink; ctx.lineWidth = 16; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
  const s = small ? .7 : 1, a = small ? .35 : 1, pulse = 1 + .03 * Math.sin(lt * 2);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H / 2 + (small ? 0 : 20)); ctx.rotate(Math.sin(lt * .6) * .06); ctx.scale(s * pulse, s * pulse);
  for (let p = 0; p < 5; p++) {
    ctx.save(); ctx.rotate(p * 1.2566 + lt * .05);
    ctx.fillStyle = '#f2f0cc'; ctx.beginPath(); ctx.ellipse(0, -150, 120, 170, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = COL.pink;
    BLOSSOM_DOTS.forEach((d, j) => { if (j % 5 !== p) return; ctx.beginPath(); ctx.arc(Math.cos(d.a) * 100 * d.d, -150 + Math.sin(d.a) * 150 * d.d, d.s * .8, 0, 6.283); ctx.fill(); });
    ctx.restore();
  }
  ctx.fillStyle = '#e46fb8'; ctx.beginPath(); ctx.arc(0, 0, 55, 0, 6.283); ctx.fill();
  ctx.restore();
}

// ---------- text helpers ----------
function slamLines(b, lt, lines, opt) {
  const { color, maxS = 330, cy = H * .5, maxW = 960, stagger, maxH = 1300, shadow } = opt;
  let sizes = lines.map(l => fitSize(l, 'Anton', maxW, maxS));
  let tot = sizes.reduce((a, s) => a + s, 0);
  if (tot > maxH) { sizes = sizes.map(s => s * maxH / tot); tot = maxH; }
  const stg = stagger ?? Math.min(.22, b.d * .4 / lines.length);
  let y = cy - tot / 2;
  const out = [];
  lines.forEach((l, i) => {
    const s = sizes[i]; const yc = y + s * .5; y += s;
    ctx.font = `${s}px Anton`; const w = ctx.measureText(l).width;
    const k = clamp((lt - i * stg) / .2); if (k <= 0) { out.push(null); return; }
    const sc = 1 + (1 - eOutCubic(k)) * .35;
    ctx.save(); ctx.translate(W / 2, yc); ctx.scale(sc, sc);
    ctx.font = `${s}px Anton`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (shadow) { ctx.fillStyle = shadow; ctx.fillText(l, 6, 6); }
    ctx.fillStyle = color; ctx.fillText(l, 0, 0);
    ctx.restore();
    out.push({ y: yc, w, s, t0: i * stg });
  });
  return out;
}
function scribbleLine(x0, x1, y, k, col, wdt = 10, seed = 1) {
  if (k <= 0) return;
  const r = rng(seed); ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = wdt; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); const n = 16;
  for (let i = 0; i <= n; i++) { const x = lerp(x0, x1, i / n * k), yy = y + (r() - .5) * 10 + Math.sin(i * .9) * 4; i === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
  ctx.stroke(); ctx.restore();
}
function scribbleCircle(cx, cy, rx, ry, k, col, seed = 3) {
  if (k <= 0) return;
  const r = rng(seed); ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); const n = 60, turns = 1.15;
  for (let i = 0; i <= n * k; i++) { const a = -2.6 + i / n * 6.283 * turns, j = 1 + (r() - .5) * .04 + i / n * .06; const x = cx + Math.cos(a) * rx * j, y = cy + Math.sin(a) * ry * j; i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke(); ctx.restore();
}
function checkMark(x, y, k, col) {
  if (k <= 0) return;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - 30, y);
  const k1 = clamp(k * 2), k2 = clamp(k * 2 - 1);
  ctx.lineTo(x - 30 + 22 * k1, y + 26 * k1); if (k2 > 0) ctx.lineTo(x - 8 + 48 * k2, y + 26 - 64 * k2); ctx.stroke(); ctx.restore();
}
function justifiedLines(b, lt, lines, color, opt = {}) {
  const mx = 44, maxW = W - mx * 2, ls = -0.065;
  ctx.font = '900 100px Inter'; ctx.letterSpacing = `${ls * 100}px`;
  const ws = lines.map(l => ctx.measureText(l).width);
  const s = Math.min(185, 100 * maxW / Math.max(...ws));
  const lh = s * .96, tot = lh * lines.length, y0 = (opt.cy ?? H * .5) - tot / 2 + lh / 2;
  ctx.font = `900 ${s}px Inter`; ctx.letterSpacing = `${ls * s}px`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  lines.forEach((l, i) => {
    const words = l.split(' '); const k = eOutExpo(clamp((lt - i * .11) / .55)); if (k <= 0) return;
    const wW = words.map(w => ctx.measureText(w).width); const sum = wW.reduce((a, c) => a + c, 0);
    const y = y0 + i * lh;
    ctx.save(); ctx.globalAlpha = clamp(k * 3); ctx.fillStyle = color; ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 24;
    if (words.length === 1) {
      const chars = [...l]; const cw = chars.map(c => ctx.measureText(c).width); const csum = cw.reduce((a, c) => a + c, 0);
      const gap = Math.min((maxW - csum) / Math.max(chars.length - 1, 1), s * .9);
      let x = W / 2 - (csum + gap * (chars.length - 1)) / 2;
      chars.forEach((c, j) => { const off = (1 - k) * (j - chars.length / 2) * 40; ctx.fillText(c, x + off, y); x += cw[j] + gap; });
    } else {
      const gap = (maxW - sum) / (words.length - 1); let x = mx;
      words.forEach((w, j) => { const dir = j < words.length / 2 ? -1 : 1; ctx.fillText(w, x + dir * (1 - k) * 160, y); x += wW[j] + gap; });
    }
    ctx.restore();
  });
  ctx.letterSpacing = '0px';
}
function handLines(b, lt, lines, color, opt = {}) {
  const offs = [-90, 120, -40, 80, -110], rots = [-.03, .025, -.015, .03, -.02];
  const base = opt.size || 124; const lh = base * 1.25; const y0 = (opt.cy ?? H * .47) - lh * (lines.length - 1) / 2;
  let tcur = .05;
  lines.forEach((l, i) => {
    ctx.font = `700 ${base}px Caveat`; let w = ctx.measureText(l).width; const s = Math.min(1, 940 / w) * base;
    ctx.font = `700 ${s}px Caveat`; w = ctx.measureText(l).width;
    const cx = clamp(W / 2 + offs[i % 5], w / 2 + 50, W - w / 2 - 50), y = y0 + i * lh;
    const dur = .05 + l.length * .03; const k = clamp((lt - tcur) / dur); tcur += dur + .05;
    if (k <= 0) return;
    ctx.save(); ctx.translate(cx, y); ctx.rotate(rots[i % 5]);
    ctx.beginPath(); ctx.rect(-w / 2 - 20, -s, (w + 40) * k, s * 2); ctx.clip();
    ctx.fillStyle = color; ctx.shadowColor = 'rgba(0,0,30,.25)'; ctx.shadowBlur = 14; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(l, 0, 0);
    ctx.restore();
  });
}
function skyLines(b, lt, lines, color, opt = {}) {
  const s = opt.size || 150; ctx.font = `800 ${s}px Inter`; ctx.letterSpacing = `${-0.06 * s}px`; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const maxw = Math.max(...lines.map(l => ctx.measureText(l).width)); const S = s * Math.min(1, 860 / maxw);
  ctx.font = `800 ${S}px Inter`; ctx.letterSpacing = `${-0.06 * S}px`;
  const lh = S * .98, y0 = (opt.cy ?? 760) - lh * (lines.length - 1) / 2;
  const half = Math.ceil(lines.length / 2);
  lines.forEach((l, i) => {
    const k = eOutExpo(clamp((lt - .05 - i * .16) / .6)); if (k <= 0) return;
    const w = ctx.measureText(l).width; const x = i < half ? 110 + i * 30 : Math.min(980 - w, 300 + (i - half) * 90);
    ctx.save(); ctx.globalAlpha = clamp(k * 2); ctx.fillStyle = color; ctx.shadowColor = 'rgba(30,60,120,.25)'; ctx.shadowBlur = 18;
    ctx.fillText(l, x, y0 + i * lh + (1 - k) * 40); ctx.restore();
  });

}
function corner(items, act, color) {
  ctx.save(); ctx.font = '700 30px Inter'; ctx.letterSpacing = '-1px'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  items.forEach((it, i) => {
    ctx.fillStyle = color; ctx.globalAlpha = (act === i + 1 || act === 4) ? 1 : .55;
    ctx.fillText(it, 830, 250 + i * 32);
    if (act === i + 1) ctx.fillRect(830, 256 + i * 32, ctx.measureText(it).width, 3);

  ctx.restore();
}
function tagSticker(text, lt, bg, fg) {
  const k = eOutBack(clamp(lt / .35)); if (k <= 0) return;
  ctx.save(); ctx.translate(W / 2, 330); ctx.rotate(-.05); ctx.scale(k, k);
  ctx.font = '800 36px Inter'; ctx.letterSpacing = '4px'; const w = ctx.measureText(text).width + 70;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -40, w, 80, 40); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 2, 3);
  ctx.restore();
}
function badge(t, color) {
  const cx = 140, cy = 220, R = 62;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .6);
  ctx.font = '800 17px Inter'; ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const txt = 'ATLETA · EMPRENDEDOR · ARTISTA · '; const n = txt.length;
  for (let i = 0; i < n; i++) { ctx.save(); ctx.rotate(i / n * 6.283); ctx.translate(0, -R); ctx.fillText(txt[i], 0, 0); ctx.restore(); }
  ctx.rotate(-t * 1.2); ctx.beginPath();
  for (let i = 0; i < 16; i++) { const r = i % 2 ? 14 : 34, a = i / 16 * 6.283; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }

// ---------- looks (poster templates) ----------
const LIST_PAL = [[COL.red, COL.cream], [COL.cream, COL.red], [COL.track, COL.white], [COL.green, COL.white], [COL.pink, COL.dark], [COL.yellow, COL.ink]];
const LOOKS = {
  cream(b, lt) {
    paperBg(COL.cream);
    const out = slamLines(b, lt, b.lines, { color: COL.red, shadow: 'rgba(0,0,0,.07)' });
    const last = out[out.length - 1];
    if (b.strike !== undefined) {
      const o = out[b.strike]; if (o) scribbleLine(W / 2 - o.w / 2 - 20, W / 2 + o.w / 2 + 20, o.y + 6, eInOut(clamp((lt - .9) / .35)), COL.ink, 16, 4);
    } else if (last) scribbleLine(W / 2 - last.w / 2, W / 2 + last.w / 2, last.y + last.s * .55, eInOut(clamp((lt - last.t0 - .3) / .4)), COL.ink, 9, b.i);
    return COL.red;
  },
  red(b, lt) {
    paperBg(COL.red);
    slamLines(b, lt, b.lines, { color: COL.cream, shadow: 'rgba(0,0,0,.12)' });
    return COL.cream;
  },
  sky(b, lt) {
    skyBg(lt);
    skyLines(b, lt, b.lines, COL.pale);
    if (b.corner) corner(b.corner, b.act, COL.pale);
    return COL.pale;
  },
  grass(b, lt) {
    grassBg(lt);
    justifiedLines(b, lt, b.lines, COL.white);
    return COL.white;
  },
  track(b, lt) {
    trackBg(lt);
    handLines(b, lt, b.hand, COL.white);
    return COL.white;
  },
  pink(b, lt) {
    const hasScript = !!b.script;
    pinkBg(lt, !hasScript);
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 20; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (hasScript) {
      const s = 130; ctx.font = `800 ${s}px Inter`; ctx.letterSpacing = `${-.05 * s}px`;
      b.lines.forEach((l, i) => { const k = eOutExpo(clamp((lt - i * .15) / .5)); ctx.globalAlpha = clamp(k * 2); ctx.fillStyle = COL.white; ctx.fillText(l, W / 2, 500 + i * 135 + (1 - k) * 30); });
      ctx.letterSpacing = '0px'; ctx.globalAlpha = 1;
      const ss = fitSize(b.script, 'GreatVibes', 900, 330); ctx.font = `${ss}px GreatVibes`;
      const w = ctx.measureText(b.script).width; const k = clamp((lt - .45) / .9);
      ctx.beginPath(); ctx.rect(W / 2 - w / 2 - 40, 1150, (w + 80) * eInOut(k), 600); ctx.clip();
      ctx.fillStyle = COL.white; ctx.fillText(b.script, W / 2, 1460);
    } else {
      const s = 92; ctx.font = `800 ${s}px Inter`; ctx.letterSpacing = `${-.05 * s}px`;
      b.lines.forEach((l, i) => { const k = eOutExpo(clamp((lt - i * .3) / .6)); ctx.globalAlpha = clamp(k * 2); ctx.fillStyle = COL.white; ctx.fillText(l, W / 2, H / 2 - (b.lines.length - 1) * 60 + i * 120 + (1 - k) * 30); });
      ctx.letterSpacing = '0px';
    }
    ctx.restore();
    return COL.dark;
  },
  list(b, lt) {
    const n = b.words.length, slot = b.d / n, i = Math.min(n - 1, Math.floor(lt / slot)), k = lt - i * slot;
    const [bg, fg] = LIST_PAL[(i + b.i) % LIST_PAL.length];
    paperBg(bg);
    const ck = eOutBack(clamp(k / .3));
    ctx.fillStyle = fg; ctx.globalAlpha = .12; ctx.beginPath(); ctx.arc(W / 2, H / 2, Math.max(0, 470 * ck), 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
