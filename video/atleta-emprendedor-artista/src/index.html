<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:200;src:url(../fonts/inter-latin-200-normal.woff2)}
@font-face{font-family:'Inter';font-weight:400;src:url(../fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:'Inter';font-weight:800;src:url(../fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:'Bebas';font-weight:400;src:url(../fonts/bebas-neue-latin-400-normal.woff2)}
@font-face{font-family:'Playfair';font-style:italic;font-weight:400;src:url(../fonts/playfair-display-latin-400-italic.woff2)}
@font-face{font-family:'Playfair';font-style:italic;font-weight:700;src:url(../fonts/playfair-display-latin-700-italic.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="cv" width="1080" height="1920"></canvas>
<script>
// Motion graphics engine: render(t) draws the frame at time t (seconds). Deterministic.
const W = 1080, H = 1920;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const TL = window.TL || [];
const ACT = ['#ffc27a', '#ff4a2b', '#f2b43c', '#a07cff', '#ffd49a', '#8c95a8'];
const INK = '#f4f1ea';

// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutBack = k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };

function frac(x) { return x - Math.floor(x); }

// ---------- timeline ----------
let acc = 0;
TL.forEach((b, i) => { b.start = acc; acc += b.d; b.i = i; });
const TOTAL = acc;
TL.forEach((b, i) => {
  const p = TL[i - 1];
  if (p && p.act === b.act) { b.actStart = p.actStart; b.prevAct = p.prevAct; }
  else { b.actStart = b.start; b.prevAct = p ? p.act : b.act; }
});
window.TOTAL = TOTAL;
function beatAt(t) { for (const b of TL) if (t < b.start + b.d) return b; return TL[TL.length - 1]; }

// ---------- static assets ----------
const grains = [];
(function () {
  const r = rng(7);
  for (let g = 0; g < 8; g++) {
    const c = document.createElement('canvas'); c.width = 540; c.height = 960;
    const x = c.getContext('2d'); const im = x.createImageData(540, 960);
    for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    x.putImageData(im, 0, 0); grains.push(c);
  }
})();
const P0 = (() => { const r = rng(11); return Array.from({ length: 170 }, () => ({ x: r() * W, y: r() * H, r: .6 + r() * 2.4, sp: .2 + r() * 1.2, ph: r() * 6.28 })); })();
const NODES = (() => { const r = rng(23); return Array.from({ length: 46 }, () => ({ x: r() * W, y: r() * H * .62, vx: (r() - .5) * 14, vy: (r() - .5) * 10 })); })();
const BOKEH = (() => { const r = rng(31); return Array.from({ length: 22 }, () => ({ x: r() * W, y: r() * H, r: 30 + r() * 110, sp: .1 + r() * .4, h: r() })); })();

// ---------- backgrounds ----------
function glow(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(col, a)); g.addColorStop(1, hexA(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function particles(t, a, col) {
  for (const p of P0) {
    const y = ((p.y - t * p.sp * 26) % H + H) % H;
    const x = p.x + Math.sin(t * .4 + p.ph) * 18;
    const tw = .45 + .55 * Math.sin(t * 2 + p.ph * 3);

    ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.283); ctx.fill();

}
function ecgShape(p) {
  // one heartbeat over p in [0,1)
  const g = (c, w, h) => h * Math.exp(-Math.pow((p - c) / w, 2));
  return g(.18, .03, -.12) + g(.30, .008, .25) + g(.33, .012, -1) + g(.36, .01, .45) + g(.55, .05, -.22);
}
const BG = [
  function hook(t, a) {
    glow(W / 2, H * .46, 900, ACT[0], .10 * a);
    particles(t, a, ACT[0]);
  },
  function body(t, a) {
    const c = ACT[1];
    glow(W / 2, H * .5, 1000, c, .13 * a);
    // rising bars
    for (let i = 0; i < 18; i++) {
      const h = (Math.sin(t * 2.2 + i * .9) * .5 + .5) * 260 + 40;
      ctx.fillStyle = hexA(c, .07 * a);
      ctx.fillRect(i * 62 + 6, H - h, 40, h);
    }
    // ECG line: faint full trace + bright sweeping segment
    const base = H * .79, amp = 170;
    const head = frac(t * .42) * (W + 500) - 100;
    const trace = (al, x0, x1) => { ctx.beginPath(); for (let x = Math.max(0, x0); x <= Math.min(W, x1); x += 4) { const y = base + amp * ecgShape(frac(x / 540)); x <= Math.max(0, x0) ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.strokeStyle = hexA(c, al); ctx.stroke(); };
    ctx.save(); ctx.lineWidth = 3; trace(.12 * a, 0, W);
    ctx.lineWidth = 4; ctx.shadowColor = c; ctx.shadowBlur = 24;
    for (let s = 0; s < 8; s++) trace((s + 1) / 8 * .9 * a, head - 700 + s * 87, head - 700 + (s + 1) * 87 + 4);
    ctx.restore();
    if (head > 0 && head < W) glow(head, base + amp * ecgShape(frac(head / 540)), 60, c, .9 * a);
  },
  function mind(t, a) {
    const c = ACT[2];
    glow(W / 2, H * .35, 900, c, .10 * a);
    // perspective grid
    const hz = H * .64;
    ctx.save(); ctx.strokeStyle = hexA(c, .22 * a); ctx.lineWidth = 1.5;
    for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 22, hz); ctx.lineTo(W / 2 + i * 260, H); ctx.stroke(); }

    }
    ctx.restore();

    ctx.lineWidth = 1.2;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
      if (d < 230) { ctx.strokeStyle = hexA(c, (1 - d / 230) * .35 * a); ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke(); }
    }
    for (const p of pts) { ctx.fillStyle = hexA(c, .8 * a); ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 6.283); ctx.fill(); }

    ctx.save(); ctx.strokeStyle = hexA(c, .55 * a); ctx.lineWidth = 3; ctx.shadowColor = c; ctx.shadowBlur = 16;
    ctx.beginPath();
    const off = t * 60;
    for (let x = 0; x <= W; x += 6) {
      const k = x / W; const y = H * .60 - k * 260 + Math.sin((x + off) * .03) * 26 + Math.sin((x + off) * .011) * 40;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke(); ctx.restore();
  },
  function soul(t, a) {
    const c = ACT[3];
    glow(W * .3, H * .3, 800, c, .12 * a); glow(W * .8, H * .75, 800, '#3fd1ff', .07 * a);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const b of BOKEH) {
      const y = ((b.y - t * b.sp * 40) % H + H) % H;
      glow(b.x + Math.sin(t * .3 + b.h * 9) * 40, y, b.r, b.h > .5 ? c : '#3fd1ff', .05 * a);
    }
    ctx.lineWidth = 2;
    for (let i = 0; i < 28; i++) {
      const k = i / 27;
      ctx.strokeStyle = k < .5 ? hexA(c, .16 * a) : hexA('#5fd8ff', .12 * a);
      ctx.beginPath();
      for (let x = -20; x <= W + 20; x += 10) {
        const y = H * .5 + (i - 14) * 20 + Math.sin(x * .006 + t * .9 + i * .21) * 150 * Math.sin(t * .23 + k * 2) + Math.sin(x * .017 - t * 1.3 + i) * 22;
        x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  },
  function union(t, a) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    [1, 2, 3].forEach((ci, k) => {
      const ang = t * .35 + k * 2.094;
      glow(W / 2 + Math.cos(ang) * 260, H * .5 + Math.sin(ang) * 380, 820, ACT[ci], .10 * a);
    });
    ctx.restore();
    particles(t * 1.3, a * .8, ACT[4]);
  },
  function tension(t, a) {
    const c = ACT[5];
    glow(W / 2, H * .48, 900, c, .06 * a);
    ctx.save(); ctx.strokeStyle = hexA(c, .16 * a); ctx.lineWidth = 2;
    for (let k = 0; k < 9; k++) {
      const r = frac(k / 9 - t * .18) * 1100;
      ctx.globalAlpha = 1 - r / 1100;
      ctx.beginPath(); ctx.arc(W / 2, H * .48, r, 0, 6.283); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = hexA('#000000', .25 * a);
    for (let y = 0; y < H; y += 6) ctx.fillRect(0, y, W, 2);
  }
];
BG[5] = BG[5];
const BGMAP = { 0: BG[0], 1: BG[1], 2: BG[2], 3: BG[3], 4: BG[4], 5: BG[5] };

// ---------- text ----------
function fontFor(f, s, accent) {
  if (f === 'serif') return `italic ${accent ? 700 : 400} ${s}px Playfair`;
  if (f === 'display') return `400 ${s}px Bebas`;
  return `${accent ? 800 : 400} ${s}px Inter`;
}
const DEF = { sans: 70, serif: 96, display: 170 };
function tokenize(str) {

  const out = []; let acc = false;
  for (const raw of str.split(' ')) {
    let w = raw, a0 = acc;
    if (w.startsWith('*')) { w = w.slice(1); a0 = true; acc = true; }

    if (w.endsWith('*')) { w = w.slice(0, -1); close = true; }
    else if (/\*[…\.,?!»]+$/.test(w)) { w = w.replace('*', ''); close = true; }

}
function layout(lines, cy) {
  // compute words with positions
  const L = lines.map(l => {
    const s = l.s || DEF[l.f]; const toks = tokenize(l.t);
    let wsum = 0;
    toks.forEach(tk => { ctx.font = fontFor(l.f, s, tk.accent); tk.wd = ctx.measureText(tk.w).width; });
    ctx.font = fontFor(l.f, s, false); const sp = ctx.measureText(' ').width * (l.f === 'display' ? .9 : 1);
    wsum = toks.reduce((q, tk) => q + tk.wd, 0) + sp * (toks.length - 1);
    let scale = wsum > 960 ? 960 / wsum : 1;
    return { l, s: s * scale, toks, sp: sp * scale, width: wsum * scale, lh: s * scale * (l.f === 'display' ? 0.98 : l.f === 'serif' ? 1.22 : 1.32) };
  });
  const total = L.reduce((q, x) => q + x.lh, 0);
  let y = cy - total / 2;
  const words = [];
  L.forEach((x, li) => {
    let px = W / 2 - x.width / 2;
    x.y = y + x.lh / 2;
    x.toks.forEach(tk => {
      ctx.font = fontFor(x.l.f, x.s, tk.accent); tk.wd = ctx.measureText(tk.w).width;
      words.push({ ...tk, x: px, y: x.y, f: x.l.f, s: x.s, li });
      px += tk.wd + x.sp;

    x.x0 = W / 2 - x.width / 2;
    y += x.lh;

}
function drawWord(wd, col, alpha, dy, blur, scale, glowA) {

  ctx.textBaseline = 'middle';
  ctx.globalAlpha = alpha;

  ctx.restore();
}
function textBlock(b, lt, lines, cy, opts = {}) {

  const stg = Math.min(.07, 1.1 / Math.max(words.length, 1));
  const impact = (b.sfx || '').includes('impact') || b.sfx === 'big';
  words.forEach((wd, i) => {
    const k = clamp((lt - tin - i * stg) / .75);
    const e = eOutExpo(k);
    let alpha = clamp(k * 2.2) * (1 - outK);
    let dy = (1 - e) * 46 - outK * 34;
    let blur = (1 - e) * 16 + outK * 12;
    let scale = 1, glowA = 0;
    let c = wd.accent ? col : INK;
    if (wd.accent) { scale = 1 + (1 - eOutCubic(clamp(k * 1.4))) * .18; glowA = .55 + .2 * Math.sin(lt * 3); }

      drawWord({ ...wd, x: wd.x - ca }, '#ff2a4a', alpha * .5, dy, blur, scale, 0);
      drawWord({ ...wd, x: wd.x + ca }, '#28d7ff', alpha * .5, dy, blur, scale, 0);
      ctx.restore();

// ---------- special scenes ----------
function sceneChapter(b, lt) {
  const col = ACT[b.act];
  const outK = clamp((lt - (b.d - .4)) / .4);
  const cy = H * .47;
  ctx.save(); ctx.globalAlpha = 1 - outK;
  // line
  const lk = eOutExpo(clamp(lt / .9));
  ctx.strokeStyle = hexA(col, .9); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W / 2 - 360 * lk, cy + 210); ctx.lineTo(W / 2 + 360 * lk, cy + 210); ctx.stroke();

  ctx.font = `400 470px Bebas`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const sk = eOutCubic(clamp(lt / 1.4));

  ctx.lineWidth = 3; ctx.strokeStyle = hexA(col, .9); ctx.shadowColor = col; ctx.shadowBlur = 30;

function sceneList(b, lt) {

function sceneStack(b, lt) {

function sceneProgress(b, lt) {

  const bx = W / 2 - 390, by = H * .55, bw = 780;
  ctx.save(); ctx.globalAlpha = 1 - outK;

  ctx.restore();

function sceneEcho(b, lt) {
  const col = ACT[b.act];
  const { outK } = textBlock(b, lt, b.lines, H * .3);
  const r = rng(99);
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 11; i++) {
    const x = 300 + r() * (W - 600), y = H * .36 + r() * H * .46, s = 30 + r() * 40, t0 = .3 + r() * 1.8;

  { const g = ctx.createLinearGradient(0, H * .55 - 110, 0, H * .55 + 110); g.addColorStop(0, 'rgba(6,6,8,0)'); g.addColorStop(.5, 'rgba(6,6,8,.85)'); g.addColorStop(1, 'rgba(6,6,8,0)'); ctx.fillStyle = g; ctx.fillRect(0, H * .55 - 110, W, 220); }

function sceneVenn(b, lt) {

function sceneTriad(b, lt) {
  const outK = clamp((lt - (b.d - .5)) / .5);
  const cx = W / 2, cy = H * .5, R = 330, rot = lt * .03;
  const V = [
    { ci: 1, ang: Math.PI * 5 / 6, small: 'EL CUERPO DE UN', big: 'ATLETA' },
    { ci: 2, ang: Math.PI / 6, small: 'LA MENTE DE UN', big: 'EMPRENDEDOR' },
    { ci: 3, ang: -Math.PI / 2, small: 'EL ALMA DE UN', big: 'ARTISTA' }
  ].map(v => ({ ...v, x: cx + Math.cos(v.ang + rot) * R, y: cy + Math.sin(v.ang + rot) * R }));
  ctx.save(); ctx.globalAlpha = 1 - outK;

    const n = V[(i + 1) % 3]; const k = eInOut(clamp((lt - (.6 + i * 1.25)) / 1.0)); if (k <= 0) return;
    const g = ctx.createLinearGradient(v.x, v.y, n.x, n.y); g.addColorStop(0, ACT[v.ci]); g.addColorStop(1, ACT[n.ci]);
    ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.shadowColor = '#fff'; ctx.shadowBlur = 12;

function sceneOutro(b, lt) {

  ctx.restore();

// ---------- HUD tracker ----------
function hud(t, b) {
  if (b.act === 0 || b.kind === 'triad' || b.kind === 'outro') return;
  const first = TL.find(x => x.act === 1).start;
  const a = clamp((t - first - .3) / .8) * .9;
  const reached = Math.max(...TL.filter(x => x.start <= t && x.act >= 1 && x.act <= 3).map(x => x.act), 0);
  const labels = ['ATLETA', 'EMPRENDEDOR', 'ARTISTA'];
  ctx.save(); ctx.globalAlpha = a; ctx.font = '400 27px Inter'; ctx.letterSpacing = '5px'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  const xs = [W / 2 - 300, W / 2, W / 2 + 300], y = 250;
  labels.forEach((l, i) => {
    const on = reached >= i + 1 || b.act === 4;
    ctx.fillStyle = on ? ACT[i + 1] : 'rgba(255,255,255,.28)';
    ctx.fillText(l, xs[i] + 2, y);
    if (i < 2) { ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(xs[i] + (i === 0 ? 85 : 140), y - 1, (i === 0 ? 75 : 20), 2); }
  });
  ctx.restore();
}

// ---------- main ----------
function render(t) {

  const zoom = 1 + .04 * eInOut(clamp(lt / b.d)) + (impact && impT >= 0 ? .03 * (1 - eOutCubic(clamp(impT / .5))) : 0);
  ctx.setTransform(zoom, 0, 0, zoom, W / 2 * (1 - zoom) + sx, H / 2 * (1 - zoom) + sy);

  // backgrounds with crossfade between acts

  // scene

  else if (k === 'list') sceneList(b, lt);
  else if (k === 'stack') sceneStack(b, lt);
  else if (k === 'progress') sceneProgress(b, lt);
  else if (k === 'echo') sceneEcho(b, lt);

  else if (k === 'triad') sceneTriad(b, lt);

  if (k === 'chapter') { const lk = clamp(lt / .9); ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(lerp(-200, W + 200, lk), H * .3, 900, ACT[b.act], .22 * Math.sin(lk * Math.PI)); ctx.restore(); }
